name: 建置雙葉書庫 APK

# 這個 repo 是一站多專案（futaba-bookshelf/ 與 wasteland-ol/）。
# 只有雙葉的檔案變動才建 APK——廢土推 main 時不該浪費 CI。
on:
  push:
    branches: [main]
    paths:
      - 'futaba-bookshelf/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:        # 也可在 Actions 頁面手動觸發

defaults:
  run:
    working-directory: futaba-bookshelf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 網頁回歸測試（不過就不出 APK）
        run: node test/run.js

      - name: 檔案伺服器測試（25 項）
        working-directory: futaba-bookshelf/android/server-test
        run: |
          SRC=../app/src/main/java/tw/ting/futaba/bookshelf
          javac -nowarn -encoding UTF-8 -d out "$SRC/MiniHttp.java" "$SRC/FileApiServer.java" ServerTest.java
          java -Dfile.encoding=UTF-8 -cp out ServerTest

      - name: 組裝網頁資產進 APK
        run: |
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST" && mkdir -p "$DEST"
          # 網頁本體：排除開發用檔案、個人資料、Android 專案本身
          tar cf - --exclude=./android --exclude=./test --exclude=./data \
                   --exclude='*.zip' --exclude='*.md' --exclude=./bump.py \
                   --exclude=./LICENSE --exclude=./.gitignore . \
            | (cd "$DEST" && tar xf -)
          # 字體：抽掉 CDN 版本，換成 APK 內建字體（離線可用的關鍵）
          cp android/fonts/fonts-local.css "$DEST/assets/css/fonts.css"
          mkdir -p "$DEST/assets/fonts"
          cp -r android/fonts/files "$DEST/assets/fonts/"
          # APK 版資產已內建，不需要 Service Worker
          rm -f "$DEST/sw.js"
          echo "資產大小：$(du -sh "$DEST" | cut -f1)"

      - name: 確認字體真的換成內建版（換不成 APK 離線就沒字）
        run: |
          DEST=android/app/src/main/assets/www
          grep -q '@import' "$DEST/assets/css/main.css" || { echo "::error::main.css 沒有引用抽換層"; exit 1; }
          grep -q 'fonts.googleapis.com' "$DEST/assets/css/fonts.css" \
            && { echo "::error::fonts.css 仍指向 CDN，內建字體沒換成功"; exit 1; }
          test -d "$DEST/assets/fonts/files" || { echo "::error::字體檔沒複製進去"; exit 1; }
          echo "字體抽換確認完成"

      - name: 由網頁版本號帶入 App 版本
        run: |
          VER=$(grep -o '>v[0-9]\+\.[0-9]\+[a-z]\?<' index.html | head -1 | tr -d '><v')
          CODE=$(git rev-list --count HEAD)
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode .*\/\//versionCode $CODE  \/\//" android/app/build.gradle
          echo "版本 $VER (code $CODE)"

      - name: 還原簽章金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "已載入簽章金鑰"
          else
            echo "::warning::未設定 KEYSTORE_BASE64，將輸出未簽章 APK（無法安裝）"
          fi

      - name: 建置 Release APK
        working-directory: futaba-bookshelf/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: futaba-apk
          path: futaba-bookshelf/android/app/build/outputs/apk/release/*.apk
          retention-days: 90
