<script>
// 強制 SW 更新：讓待命中的新 SW 立刻接管，避免舊版卡住
(async () => {
  if (!('serviceWorker' in navigator)) return;
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const reg of regs) {
      if (reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.update().catch(() => {});
    }
  } catch (e) {}
})();
</script>

<div id="main">
  <div id="overlay" onclick="WOL.closeSb()"></div>

  <div id="sidebar">
    <div class="sb-vitals" id="sb-vitals"></div>
    <div class="sb-lock"><svg class="ic"><use href="#i-alert"/></svg> 戰鬥中，無法離開</div>
    <div class="sb-section-label">生存</div>
    <button class="sb-nav" id="shelter-sb-btn"><svg class="ic"><use href="#i-shelter"/></svg> 避難所</button>
    <button class="sb-nav" id="character-sb-btn"><svg class="ic"><use href="#i-person"/></svg> 角色</button>
    <button class="sb-nav" id="inventory-sb-btn"><svg class="ic"><use href="#i-pack"/></svg> 背包</button>
    <button class="sb-nav" id="explore-sb-btn"><svg class="ic"><use href="#i-compass"/></svg> 探索</button>
    <button class="sb-nav" id="combat-sb-btn"><svg class="ic"><use href="#i-blade"/></svg> 戰鬥</button>

      <button class="sb-nav" id="settings-sb-btn"><svg class="ic"><use href="#i-gear"/></svg> 設定</button>
      <button class="sb-nav" id="changelog-sb-btn"><svg class="ic"><use href="#i-scroll"/></svg> 更新日誌</button>
    </div>
  </div>

  <div id="content">

    <div class="page" id="shelter-page">
      <div class="page-inner">
        <div class="hero">
          <h1>廢土 <span>Online</span></h1>
          <p>撐過今天，再想明天的事。</p>
        </div>
        <div id="content-warning"></div>
        <div class="clock" id="clock"></div>
        <div class="debuff-row" id="debuff-row"></div>
        <div class="card">
          <div class="card-title"><svg class="ic"><use href="#i-heart"/></svg> 狀態</div>
          <div id="shelter-meters"></div>
        </div>
        <div class="btn-row" style="margin-bottom:14px">
          <button class="btn btn-pri" id="advance-btn"><svg class="ic"><use href="#i-clock"/></svg> 推進時間</button>
          <button class="btn" onclick="WOL.showPage('explore')"><svg class="ic"><use href="#i-compass"/></svg> 出門探索</button>
        </div>
        <div class="sec-title">事件日誌</div>
        <div class="log-box" id="shelter-log"></div>
      </div>
    </div>

    <div class="page" id="character-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-person"/></svg> 角色</div>
        <div class="card">
          <div class="card-title">屬性</div>
          <div class="attr-grid" id="attr-grid"></div>
        </div>
        <div class="card">
          <div class="card-title">衍生數值</div>
          <div class="derived-grid" id="derived-grid"></div>
          <div class="muted" id="derived-note" style="margin-top:10px"></div>
        </div>
      </div>
    </div>

    <div class="page" id="inventory-page">

        <div id="inv-list"></div>
      </div>
    </div>

    <div class="page" id="explore-page">

        <div class="page-title"><svg class="ic"><use href="#i-compass"/></svg> 探索</div>
        <div id="trip-panel"></div>
        <div id="loc-list"></div>
      </div>
    </div>

    <div class="page" id="combat-page">
      <div class="page-inner">

      </div>
    </div>

    <div class="page" id="save-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-disk"/></svg> 存檔</div>

          </div>
        </div>
        <div class="card" id="server-card">
          <div class="card-title"><svg class="ic"><use href="#i-upload"/></svg> 伺服器備份</div>
          <div class="muted">把本機存檔上傳到 shttps，或從伺服器取回覆蓋本機。</div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" onclick="WOL.backupUpload()"><svg class="ic"><use href="#i-upload"/></svg> 上傳</button>
            <button class="btn" onclick="WOL.backupRestore()"><svg class="ic"><use href="#i-download"/></svg> 還原</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">檔案匯出入</div>
          <div class="btn-row">
            <button class="btn" onclick="WOL.exportFile()">匯出 JSON</button>
            <button class="btn" onclick="WOL.importFile()">匯入 JSON</button>
          </div>
          <input type="file" id="import-input" accept="application/json" style="display:none">
        </div>
      </div>
    </div>

    <div class="page" id="settings-page">
      <div class="page-inner">

        <div class="settings-sec" id="sec-appearance">

          </div>
        </div>
        <div class="settings-sec" id="sec-update">
          <div class="settings-sec-title" onclick="WOL.toggleSec('sec-update')">系統更新</div>
          <div class="settings-sec-body">
            <div class="muted" id="build-info"></div>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn" onclick="WOL.forceUpdate()"><svg class="ic"><use href="#i-refresh"/></svg> 強制更新</button>
              <button class="btn" onclick="WOL.showPage('changelog')"><svg class="ic"><use href="#i-scroll"/></svg> 更新日誌</button>
            </div>
          </div>
        </div>
        <div class="settings-sec" id="sec-content">
          <div class="settings-sec-title" onclick="WOL.toggleSec('sec-content')">內容資料</div>
          <div class="settings-sec-body" id="content-status"></div>
        </div>
      </div>
    </div>

    <div class="page" id="changelog-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-scroll"/></svg> 更新日誌</div>
        <div id="changelog-content"></div>
      </div>
    </div>

  </div>
</div>

<div id="statusbar">
