plugins { id 'com.android.application' }

android {
    namespace 'tw.ting.futaba.bookshelf'
    compileSdk 34

    defaultConfig {
        applicationId "tw.ting.futaba.bookshelf"
        minSdk 24
        targetSdk 34
        versionCode 1          // 每次發版 +1（由 CI 依 web 版本自動帶入）
        versionName "3.3"
    }

    signingConfigs {
        release {
            // 由 GitHub Actions 從 Secrets 產生；本機建置時若無金鑰則略過
            def ksFile = file("keystore.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: "futaba"
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false          // 純 WebView 殼，無需混淆；保留可讀堆疊
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ""       // 與正式版同套件名，避免資料目錄分裂
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8 起 kotlin-stdlib 已把 jdk7/jdk8 的內容併進本體，那兩個獨立 artifact 變成
// 冗餘。androidx 相依鏈同時帶進新版 kotlin-stdlib 與舊版 kotlin-stdlib-jdk7/jdk8 時，
// 兩邊都有同一批類別，checkReleaseDuplicateClasses 就會擋下建置。排掉舊的即可。
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
}
