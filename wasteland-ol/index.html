<script>
// 強制 SW 更新：讓待命中的新 SW 立刻接管，避免舊版卡住
(async () => {
  if (!('serviceWorker' in navigator)) return;
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const reg of regs) {
      if (reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.update().catch(() => {});
    }
  } catch (e) {}
})();
</script>

        <div class="log-box" id="shelter-log"></div>
      </div>
    </div>

    <div class="page" id="character-page">

        </div>

      </div>

    <div class="page" id="inventory-page">

        <div class="page-title"><svg class="ic"><use href="#i-pack"/></svg> 背包</div>

    <div class="page" id="explore-page">

        <div id="trip-panel"></div>
        <div id="loc-list"></div>
      </div>
    </div>

    <div class="page" id="combat-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-blade"/></svg> 戰鬥 <span class="turn-badge" id="turn-badge"></span></div>
        <div id="combat-body"></div>
      </div>
    </div>

    <div class="page" id="save-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-disk"/></svg> 存檔</div>
        <div class="card">
          <div class="card-title">本機存檔</div>
          <div class="muted" id="save-info"></div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-pri" onclick="WOL.saveNow()">立即存檔</button>
            <button class="btn btn-danger" onclick="WOL.resetGame()">重新開始</button>
          </div>
        </div>
        <div class="card" id="server-card">
          <div class="card-title"><svg class="ic"><use href="#i-upload"/></svg> 伺服器備份</div>
          <div class="muted">把本機存檔上傳到 shttps，或從伺服器取回覆蓋本機。</div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn" onclick="WOL.backupUpload()"><svg class="ic"><use href="#i-upload"/></svg> 上傳</button>
            <button class="btn" onclick="WOL.backupRestore()"><svg class="ic"><use href="#i-download"/></svg> 還原</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">檔案匯出入</div>
          <div class="btn-row">
            <button class="btn" onclick="WOL.exportFile()">匯出 JSON</button>
            <button class="btn" onclick="WOL.importFile()">匯入 JSON</button>
          </div>
          <input type="file" id="import-input" accept="application/json" style="display:none">
        </div>
      </div>
    </div>

    <div class="page" id="settings-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-gear"/></svg> 設定</div>
        <div class="settings-sec" id="sec-appearance">
          <div class="settings-sec-title" onclick="WOL.toggleSec('sec-appearance')">外觀</div>
          <div class="settings-sec-body">
            <div class="set-row"><svg class="ic"><use href="#i-moon"/></svg> 夜間模式 <span class="spacer"></span><div class="switch" id="sw-night" onclick="WOL.toggleNight()"></div></div>
          </div>
        </div>
        <div class="settings-sec" id="sec-update">
          <div class="settings-sec-title" onclick="WOL.toggleSec('sec-update')">系統更新</div>
          <div class="settings-sec-body">
            <div class="muted" id="build-info"></div>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn" onclick="WOL.forceUpdate()"><svg class="ic"><use href="#i-refresh"/></svg> 強制更新</button>
              <button class="btn" onclick="WOL.showPage('changelog')"><svg class="ic"><use href="#i-log"/></svg> 更新日誌</button>
            </div>
          </div>
        </div>
        <div class="settings-sec" id="sec-content">
          <div class="settings-sec-title" onclick="WOL.toggleSec('sec-content')">內容資料</div>
          <div class="settings-sec-body" id="content-status"></div>
        </div>
      </div>
    </div>

    <div class="page" id="changelog-page">
      <div class="page-inner">
        <div class="page-title"><svg class="ic"><use href="#i-log"/></svg> 更新日誌</div>
        <div id="changelog-content"></div>
      </div>
    </div>

  </div>
</div>

<div id="statusbar">
